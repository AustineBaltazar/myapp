services:
  myapp:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - /home/austine/myapp:/app
    depends_on:
      - mydb

  mydb:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: mypassword123
    volumes:
      - mydb-data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  mydb-data:
